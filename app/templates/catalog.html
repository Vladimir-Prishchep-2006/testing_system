{% extends "base.html" %}
{% block content %}
<h1>Каталог тестов</h1>

<form id="filters" class="filters">
  <input name="search" placeholder="Название теста">
  <select name="category_id"><option value="">Все предметы</option></select>
  <select name="difficulty">
    <option value="">Любая сложность</option>
    <option value="easy">Лёгкий</option>
    <option value="medium">Средний</option>
    <option value="hard">Сложный</option>
  </select>
  <input name="min_price" type="number" min="0" placeholder="Цена от, ₸">
  <input name="max_price" type="number" min="0" placeholder="Цена до, ₸">
  <select name="sort">
    <option value="id">По умолчанию</option>
    <option value="price_asc">Сначала дешёвые</option>
    <option value="price_desc">Сначала дорогие</option>
    <option value="title">По названию</option>
  </select>
  <button>Найти</button>
</form>

<div id="list"></div>
<div id="pager" class="pager"></div>
{% endblock %}

{% block script %}
<script>
const LEVEL = { easy: "лёгкий", medium: "средний", hard: "сложный" };
let page = 1;

async function loadCategories() {
  const categories = await api("/categories");
  const select = document.querySelector("[name=category_id]");
  categories.forEach((c) => select.add(new Option(c.name, c.id)));
}

async function load() {
  // собираем параметры запроса из формы, пустые поля пропускаем
  const params = new URLSearchParams({ page, size: 8 });
  new FormData(document.getElementById("filters")).forEach((value, key) => {
    if (value) params.set(key, value);
  });
  let data;
  try { data = await api("/tests?" + params); } catch (e) { return notify(e.message); }

  document.getElementById("list").innerHTML = data.items.map((t) => `
    <div class="row">
      <div>
        <h3><a href="/tests/${t.id}">${esc(t.title)}</a></h3>
        <p class="meta">${esc(t.category.name)}, ${LEVEL[t.difficulty]}, ${t.duration_minutes} мин, вопросов: ${t.questions_count}</p>
      </div>
      <div class="side">
        <span class="price">${money(t.price)}</span>
      </div>
    </div>`).join("") || "<p>Ничего не найдено</p>";

  document.getElementById("pager").innerHTML = `
    <button class="ghost" ${page <= 1 ? "disabled" : ""} onclick="go(${page - 1})">Назад</button>
    <span>Страница ${data.page} из ${data.pages}, найдено: ${data.total}</span>
    <button class="ghost" ${page >= data.pages ? "disabled" : ""} onclick="go(${page + 1})">Вперёд</button>`;
}

function go(p) { page = p; load(); }

document.getElementById("filters").addEventListener("submit", (e) => {
  e.preventDefault();
  page = 1;
  load();
});

loadCategories().then(load);
</script>
{% endblock %}
