{% extends "base.html" %}
{% block title %}Личный кабинет{% endblock %}
{% block content %}
<h1>Личный кабинет</h1>

<h2>Купленные тесты</h2>
<div id="mine"></div>

<h2>История заказов</h2>
<table>
  <thead><tr><th>№</th><th>Дата</th><th>Состав</th><th>Сумма</th><th>Статус</th></tr></thead>
  <tbody id="orders"></tbody>
</table>

<h2>История попыток</h2>
<table>
  <thead><tr><th>Тест</th><th>Начат</th><th>Результат</th><th>Оценка</th><th>Статус</th></tr></thead>
  <tbody id="history"></tbody>
</table>
{% endblock %}

{% block script %}
<script>
if (!token()) location.href = "/login";

const when = (iso) => new Date(iso + "Z").toLocaleString("ru-RU");   // время с сервера в UTC

async function load() {
  const [mine, orders, history] = await Promise.all([api("/my-tests"), api("/orders/me"), api("/attempts/me")]);

  document.getElementById("mine").innerHTML = mine.map((m) => `
    <div class="row">
      <div><a href="/tests/${m.test.id}">${esc(m.test.title)}</a>
        <p class="meta">Осталось попыток: ${m.attempts_left}</p></div>
      <a href="/tests/${m.test.id}">${m.attempts_left > 0 ? "Пройти" : "Купить ещё"}</a>
    </div>`).join("") || '<p>Пока ничего не куплено. <a href="/">Выберите тест в каталоге.</a></p>';

  document.getElementById("orders").innerHTML = orders.map((o) => `
    <tr>
      <td>${o.id}</td>
      <td>${when(o.created_at)}</td>
      <td>${o.items.map((i) => `${esc(i.title)}, попыток: ${i.quantity}`).join("<br>")}</td>
      <td>${money(o.total)}</td>
      <td>${o.status === "paid" ? "оплачен" : esc(o.status)}</td>
    </tr>`).join("") || '<tr><td colspan="5">Заказов пока нет</td></tr>';

  document.getElementById("history").innerHTML = history.map((a) => {
    const status = a.passed === null ? "не завершена" : a.passed ? "сдан" : "не сдан";
    return `<tr>
      <td>${esc(a.test_title)}</td>
      <td>${when(a.started_at)}</td>
      <td>${a.percent === null ? "—" : a.percent + "%"}</td>
      <td>${a.grade ?? "—"}</td>
      <td>${status}</td></tr>`;
  }).join("") || '<tr><td colspan="5">Попыток пока нет</td></tr>';
}

load();
</script>
{% endblock %}
